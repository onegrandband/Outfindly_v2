<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outfindly v2.0</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f17;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loading-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="text/javascript">
      // GitHub Pages SPA router redirection (spa-github-pages)
      // Converts deep paths (e.g. /save, /creator) into a query param for index.html
      (function() {
        var l = window.location;
        // Check if on custom domain (outfindly.app55.site) vs github.io subfolder
        var pathSegmentsToKeep = 0;
        if (l.hostname.endsWith('github.io') && l.pathname.split('/').length > 2 && l.pathname.split('/')[1]) {
          pathSegmentsToKeep = 1;
        }

        var redirectUrl = 
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
          encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash;

        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <div class="loading-indicator">
      <div class="spinner"></div>
      <p style="font-size: 14px; margin: 0;">Loading Outfindly...</p>
    </div>
  </body>
</html>
